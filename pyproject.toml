[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sid-digi"
version = "0.1.0"
description = "First-principles C64 SID digi (PCM/sample) playback techniques, driven through pyresidfp"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "sid-digi contributors" }]
keywords = ["c64", "sid", "digi", "pcm", "reSIDfp", "pyresidfp", "chiptune"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "pyresidfp>=0.17.0",
    "numpy>=1.21",
    "scipy>=1.7",
    "soundfile>=0.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "black==26.3.1",
]
# the pure-Python RE fallback oracle needs a 6502 emulator
re = [
    "py65>=1.1",
]

[tool.setuptools]
packages = ["siddigi"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
